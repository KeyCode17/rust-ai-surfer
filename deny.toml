[advisories]
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards         = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-git        = []
