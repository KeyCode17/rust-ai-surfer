[package]
name         = "ras-examples"
description  = "rust-ai-surfer runnable PoCs"
version      = "0.0.0"
edition      = "2024"
license      = "MIT"
publish      = false

[[example]]
name = "claude_code_oauth_cosmium"
path = "claude_code_oauth_cosmium.rs"

[[example]]
name = "youtube_search_smoke"
path = "youtube_search_smoke.rs"

[[example]]
name = "youtube_search_claude_code"
path = "youtube_search_claude_code.rs"

[[example]]
name = "pedidosya_perimeterx_smoke"
path = "pedidosya_perimeterx_smoke.rs"

[[example]]
name = "mouse_drag_smoke"
path = "mouse_drag_smoke.rs"

[[example]]
name = "pedidosya_px_solver"
path = "pedidosya_px_solver.rs"

[dependencies]
anyhow             = "1"
serde_json         = "1"
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url                = { version = "2", features = ["serde"] }
dotenvy            = "0.15"
ras-agent          = { path = "../ras-agent" }
ras-browser        = { path = "../ras-browser" }
ras-cdp            = { path = "../ras-cdp" }
ras-cosmium        = { path = "../ras-cosmium" }
ras-dom            = { path = "../ras-dom" }
ras-events         = { path = "../ras-events" }
ras-llm            = { path = "../ras-llm" }
ras-llm-anthropic  = { path = "../ras-llm-anthropic", features = ["claude-code"] }
ras-llm-openrouter = { path = "../ras-llm-openrouter" }
ras-tools          = { path = "../ras-tools" }
ras-types          = { path = "../ras-types" }
