name: publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish even on patch bumps"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            FORCE='${{ github.event.inputs.force }}'
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            if [ "$FORCE" = "true" ]; then
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              echo "[gate] manual run with force=true; publishing $VERSION"
              exit 0
            fi
            TAG_SHA="$(git rev-parse HEAD)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            TAG_SHA="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          fi

          if ! git branch -r --contains "$TAG_SHA" | grep -qE '^\s*origin/main$'; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "[gate] $VERSION not reachable from origin/main; skipping crates.io"
            exit 0
          fi

          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                 | grep -v "^v$VERSION$" | head -n 1 || true)
          PREV=${PREV#v}
          if [ -z "$PREV" ]; then PREV="0.0.0"; fi

          IFS=. read -r CX CY CZ <<<"$VERSION"
          IFS=. read -r PX PY PZ <<<"$PREV"

          if [ "$CX" -ne "$PX" ] || [ "$CY" -ne "$PY" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "[gate] $PREV -> $VERSION is minor or major (and on main); publishing"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "[gate] $PREV -> $VERSION is patch only; skipping crates.io"
          fi

  publish:
    needs: decide
    if: needs.decide.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-workspaces
      - name: publish per-crate with rate-limit backoff
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set +e
          set +o pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is empty"
            exit 1
          fi
          ORDER=(
            ras-errors ras-types ras-validation ras-config
            ras-events ras-cdp ras-cosmium
            ras-llm
            ras-llm-anthropic ras-llm-openai ras-llm-google ras-llm-groq
            ras-llm-bedrock ras-llm-openrouter ras-llm-vercel ras-llm-deepseek
            ras-llm-cerebras ras-llm-mistral ras-llm-ollama ras-llm-oci
            ras-llm-cloud ras-llm-langchain
            ras-browser ras-dom ras-tools ras-watchdogs ras-filesystem
            ras-tokens ras-judge ras-telemetry ras-recording ras-sandbox
            ras-skills ras-mcp ras-cloud
            ras-agent
          )
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "[info] target version $VERSION"
          FAILED=()
          for crate in "${ORDER[@]}"; do
            search_out=$(cargo search "$crate" --limit 1 2>/dev/null || true)
            published=$(echo "$search_out" | grep -E "^$crate = " | sed -E 's/.*"([^"]+)".*/\1/' || true)
            if [ "$published" = "$VERSION" ]; then
              echo "[skip] $crate $VERSION already published"
              continue
            fi
            echo "[publish] $crate -> crates.io as $VERSION"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              out=$(cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN" 2>&1)
              rc=$?
              echo "$out"
              if [ "$rc" -eq 0 ]; then
                echo "[ok] $crate"
                ok=1
                break
              fi
              if echo "$out" | grep -qE "already exists on crates\.io|already uploaded"; then
                echo "[ok] $crate (already on crates.io index, skipping)"
                ok=1
                break
              fi
              if echo "$out" | grep -q "429 Too Many Requests"; then
                wait_seconds=420
              else
                wait_seconds=$(( attempt * 60 ))
              fi
              echo "::warning::publish $crate failed (rc=$rc); sleeping ${wait_seconds}s (attempt $attempt/6)"
              sleep "$wait_seconds"
            done
            if [ "$ok" -eq 0 ]; then
              FAILED+=("$crate")
            fi
            sleep 12
          done
          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::${#FAILED[@]} crate(s) failed to publish: ${FAILED[*]}"
            exit 1
          fi
