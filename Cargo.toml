[workspace]
resolver = "3"
members = [
    "ras-cli",
    "ras-daemon",

    "ras-errors",
    "ras-types",
    "ras-validation",
    "ras-config",

    "ras-events",
    "ras-cdp",
    "ras-cosmium",

    "ras-llm",
    "ras-llm-anthropic",
    "ras-llm-openai",
    "ras-llm-google",
    "ras-llm-groq",
    "ras-llm-bedrock",
    "ras-llm-openrouter",
    "ras-llm-vercel",
    "ras-llm-deepseek",
    "ras-llm-cerebras",
    "ras-llm-mistral",
    "ras-llm-ollama",
    "ras-llm-oci",
    "ras-llm-cloud",
    "ras-llm-langchain",

    "ras-browser",
    "ras-dom",
    "ras-tools",
    "ras-watchdogs",
    "ras-filesystem",
    "ras-tokens",
    "ras-judge",
    "ras-telemetry",
    "ras-recording",
    "ras-sandbox",
    "ras-skills",
    "ras-mcp",
    "ras-cloud",

    "ras-agent",

    "xtask",
]
exclude         = ["examples", "tests", "docs", "scripts"]
default-members = ["ras-cli", "ras-daemon"]

[workspace.package]
version       = "2.1.5"
edition       = "2024"
rust-version  = "1.95.0"
license       = "MIT"
repository    = "https://github.com/KeyCode17/rust-ai-surfer"
homepage      = "https://github.com/KeyCode17/rust-ai-surfer"
authors       = ["KeyCode17"]
description   = "Rust port of browser-use - Claude Code OAuth + Cosmium-driven CDP browser automation"
keywords      = ["browser", "automation", "llm", "agent", "cdp"]
categories    = ["web-programming", "command-line-utilities"]

[workspace.dependencies]
ras-errors      = { path = "ras-errors",      version = "2.1.0" }
ras-types       = { path = "ras-types",       version = "2.1.0" }
ras-validation  = { path = "ras-validation",  version = "2.1.0" }
ras-config      = { path = "ras-config",      version = "2.1.0" }

ras-events      = { path = "ras-events",      version = "2.1.0" }
ras-cdp         = { path = "ras-cdp",         version = "2.1.0" }
ras-cosmium     = { path = "ras-cosmium",     version = "2.1.0" }

ras-llm             = { path = "ras-llm",             version = "2.1.0" }
ras-llm-anthropic   = { path = "ras-llm-anthropic",   version = "2.1.0" }
ras-llm-openai      = { path = "ras-llm-openai",      version = "2.1.0" }
ras-llm-google      = { path = "ras-llm-google",      version = "2.1.0" }
ras-llm-groq        = { path = "ras-llm-groq",        version = "2.1.0" }
ras-llm-bedrock     = { path = "ras-llm-bedrock",     version = "2.1.0" }
ras-llm-openrouter  = { path = "ras-llm-openrouter",  version = "2.1.0" }
ras-llm-vercel      = { path = "ras-llm-vercel",      version = "2.1.0" }
ras-llm-deepseek    = { path = "ras-llm-deepseek",    version = "2.1.0" }
ras-llm-cerebras    = { path = "ras-llm-cerebras",    version = "2.1.0" }
ras-llm-mistral     = { path = "ras-llm-mistral",     version = "2.1.0" }
ras-llm-ollama      = { path = "ras-llm-ollama",      version = "2.1.0" }
ras-llm-oci         = { path = "ras-llm-oci",         version = "2.1.0" }
ras-llm-cloud       = { path = "ras-llm-cloud",       version = "2.1.0" }
ras-llm-langchain   = { path = "ras-llm-langchain",   version = "2.1.0" }

ras-browser     = { path = "ras-browser",     version = "2.1.0" }
ras-dom         = { path = "ras-dom",         version = "2.1.0" }
ras-tools       = { path = "ras-tools",       version = "2.1.0" }
ras-watchdogs   = { path = "ras-watchdogs",   version = "2.1.0" }
ras-filesystem  = { path = "ras-filesystem",  version = "2.1.0" }
ras-tokens      = { path = "ras-tokens",      version = "2.1.0" }
ras-judge       = { path = "ras-judge",       version = "2.1.0" }
ras-telemetry   = { path = "ras-telemetry",   version = "2.1.0" }
ras-recording   = { path = "ras-recording",   version = "2.1.0" }
ras-sandbox     = { path = "ras-sandbox",     version = "2.1.0" }
ras-skills      = { path = "ras-skills",      version = "2.1.0" }
ras-mcp         = { path = "ras-mcp",         version = "2.1.0" }
ras-cloud       = { path = "ras-cloud",       version = "2.1.0" }

ras-agent       = { path = "ras-agent",       version = "2.1.0" }

async-trait        = "0.1"
tokio              = { version = "1", features = ["full"] }
tokio-util         = { version = "0.7", features = ["rt"] }
futures            = "0.3"
chromiumoxide      = { version = "0.6", features = ["tokio-runtime"] }
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
thiserror          = "2"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
schemars           = "0.8"
validator          = { version = "0.19", features = ["derive"] }
uuid               = { version = "1", features = ["v7", "serde"] }
url                = { version = "2", features = ["serde"] }
smol_str           = { version = "0.3.6", features = ["serde"] }
indexmap           = { version = "2", features = ["serde"] }
chrono             = { version = "0.4", features = ["serde"] }
sha2               = "0.10"
regex              = "1.11"
once_cell          = "1.20"
keyring            = "3"
clap               = { version = "4.5", features = ["derive", "env"] }
dotenvy            = "0.15"
async-broadcast    = "0.7"
image              = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
walkdir            = "2"
tempfile           = "3"
wiremock           = "=0.6.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro   = "deny"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"

[profile.dev]
debug         = "limited"

[profile.test]
opt-level     = 1

[profile.bench]
inherits      = "release"
debug         = true
